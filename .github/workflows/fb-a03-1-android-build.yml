name: FB-A03.1 Android Build Verification

on:
  push:
    branches:
      - main
      - feat/f08-b2-r4-capture-frame-pool
    paths:
      - ".github/workflows/fb-a03-1-android-build.yml"
      - "app/**"
      - "policy/**"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-a03-1-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Offline policy, Android APKs, manifest and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 preview platform
        shell: bash
        run: |
          mkdir -p verification-logs
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list --channel=3 | grep -F 'platforms;android-37.0'
          sdkmanager --channel=3 "platforms;android-37.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Provision Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Generate and verify Gradle Wrapper
        shell: bash
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 9.7.0 --distribution-type bin --stacktrace 2>&1 | tee verification-logs/gradle-wrapper.log
          test -x ./gradlew
          grep -F "gradle-9.7.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version 2>&1 | tee verification-logs/gradle-version.log

      - name: Run Kotlin/JVM policy verification
        id: policy
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :policy:verifyPolicy 2>&1 | tee verification-logs/policy-verify.log

      - name: Run app unit tests
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee verification-logs/app-unit-tests.log
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          assert reports, "No Gradle JUnit XML reports were generated"
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          classes = set()
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, "0"))
              for case in root.findall(".//testcase"):
                  classes.add(case.get("classname", ""))
          expected = {
              "com.fruitblast.app.capture.CaptureSessionStateTest",
              "com.fruitblast.app.capture.CaptureSessionOwnerTest",
              "com.fruitblast.app.capture.OwnershipTransferTypesTest",
              "com.fruitblast.app.capture.SessionQuarantineRegistryTest",
          }
          missing = sorted(expected - classes)
          assert not missing, f"Expected capture unit test classes missing from execution reports: {missing}"
          assert totals["tests"] > 0, "Gradle reported zero executed unit tests"
          assert totals["failures"] == 0 and totals["errors"] == 0, (
              f"Unit test failures detected: {totals}"
          )
          print(f"PASS: app unit tests {totals}; capture test classes verified: {sorted(expected)}")
          PY

      - name: Assemble production debug APK
        id: production
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee verification-logs/assemble-debug.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Assemble instrumentation test APK
        id: instrumentation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee verification-logs/assemble-android-test.log
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Run Android lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee verification-logs/lint-debug.log
          test -s app/build/reports/lint-results-debug.xml
          test -s app/build/reports/lint-results-debug.html
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = "app/build/reports/lint-results-debug.xml"
          root = ET.parse(report).getroot()
          issues = root.findall(".//issue")
          errors = [i for i in issues if (i.get("severity") or "").lower() in {"error", "fatal"}]
          warnings = [i for i in issues if (i.get("severity") or "").lower() == "warning"]
          print(f"Lint issues: {len(issues)}; warnings: {len(warnings)}; errors/fatal: {len(errors)}")
          if errors:
              for issue in errors:
                  print(f"{issue.get('severity')}: {issue.get('id')}: {issue.get('message')}")
              raise SystemExit("Lint report contains Error/Fatal findings")
          PY

      - name: Verify APK manifests and AccessibilityService configuration
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          PROD_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

          test -s "$PROD_APK"
          test -s "$TEST_APK"
          "$ANALYZER" manifest print "$PROD_APK" > verification-logs/production-manifest.xml
          "$ANALYZER" manifest print "$TEST_APK" > verification-logs/instrumentation-manifest.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import re

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          production = ET.parse("verification-logs/production-manifest.xml").getroot()
          test_manifest = ET.parse("verification-logs/instrumentation-manifest.xml").getroot()

          app = production.find("application")
          assert app is not None, "Production APK has no application element"
          service = next(
              (node for node in app.findall("service")
               if (node.get(ANDROID + "name") or "").endswith("FruitBlastAccessibilityService")),
              None,
          )
          assert service is not None, "AccessibilityService is missing from production APK"
          assert service.get(ANDROID + "exported") == "true", "AccessibilityService exported must be true"
          assert service.get(ANDROID + "permission") == "android.permission.BIND_ACCESSIBILITY_SERVICE"
          actions = {
              node.get(ANDROID + "name")
              for intent in service.findall("intent-filter")
              for node in intent.findall("action")
          }
          assert "android.accessibilityservice.AccessibilityService" in actions, "AccessibilityService intent action missing"
          metadata = {
              node.get(ANDROID + "name"): node.get(ANDROID + "resource")
              for node in service.findall("meta-data")
          }
          resource_ref = metadata.get("android.accessibilityservice")
          resource_match = re.fullmatch(r"@ref/0x([0-9a-fA-F]{8})", resource_ref or "")
          assert resource_match, f"AccessibilityService metadata must reference a compiled resource, got {resource_ref!r}"
          resource_id = resource_match.group(1).lower()

          import os
          import subprocess
          from pathlib import Path
          build_tools = Path(os.environ["ANDROID_HOME"]) / "build-tools"
          aapt_candidates = sorted(build_tools.glob("*/aapt"), reverse=True)
          assert aapt_candidates, "Android build-tools aapt executable is missing"
          resource_dump = subprocess.run(
              [str(aapt_candidates[0]), "dump", "resources", "app/build/outputs/apk/debug/app-debug.apk"],
              check=True, capture_output=True, text=True,
          ).stdout
          resource_pattern = rf"resource\s+0x{resource_id}\s+[^\s:]+:xml/fruit_blast_accessibility_service\b"
          assert re.search(resource_pattern, resource_dump), (
              "AccessibilityService metadata resource ID does not map to "
              "xml/fruit_blast_accessibility_service in the APK resource table"
          )

          fixture_name = "com.fruitblast.app.automation.AccessibilityNodeFixtureActivity"
          production_activities = [
              node.get(ANDROID + "name")
              for node in app.findall("activity")
          ]
          assert fixture_name not in production_activities, "Test fixture leaked into production APK"

          test_app = test_manifest.find("application")
          assert test_app is not None, "Instrumentation APK has no application element"
          fixture = next(
              (node for node in test_app.findall("activity")
               if (node.get(ANDROID + "name") or "").endswith("AccessibilityNodeFixtureActivity")),
              None,
          )
          assert fixture is not None, "AccessibilityNodeFixtureActivity missing from instrumentation APK"
          assert fixture.get(ANDROID + "exported") == "false", "Instrumentation fixture must not be exported"
          print("PASS: production service registration, permission, intent, metadata and fixture isolation")
          PY

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse("app/src/main/res/xml/fruit_blast_accessibility_service.xml").getroot()
          expected = {
              "accessibilityEventTypes": "typeWindowStateChanged|typeWindowsChanged",
              "accessibilityFeedbackType": "feedbackGeneric",
              "canRetrieveWindowContent": "true",
              "notificationTimeout": "100",
          }
          for key, value in expected.items():
              actual = root.get(ANDROID + key)
              assert actual == value, f"{key}: expected {value!r}, got {actual!r}"
          print("PASS: source AccessibilityService XML configuration")
          PY

      - name: Verify offline P0 APK identity, compiled Accessibility XML and integrity
        id: offline_p0
        shell: bash
        run: |
          set -euo pipefail
          PROD_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          BUILD_TOOLS="$ANDROID_HOME/build-tools"
          APKSIGNER="$(find "$BUILD_TOOLS" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          test -x "$ANALYZER"
          test -x "$APKSIGNER"
          test -s "$PROD_APK"
          test -s "$TEST_APK"

          {
            echo "Production application ID: $("$ANALYZER" manifest application-id "$PROD_APK")"
            echo "Production min SDK: $("$ANALYZER" manifest min-sdk "$PROD_APK")"
            echo "Production target SDK: $("$ANALYZER" manifest target-sdk "$PROD_APK")"
          } | tee verification-logs/offline-p0-identity.txt

          "$ANALYZER" resources xml --file res/xml/fruit_blast_accessibility_service.xml "$PROD_APK" \
            > verification-logs/accessibility-compiled.xml

          python3 - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          PROD_APK = "app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK = "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          ANALYZER = os.path.join(os.environ["ANDROID_HOME"], "cmdline-tools", "latest", "bin", "apkanalyzer")

          def analyzer(*args):
              return subprocess.run(
                  [ANALYZER, *args], check=True, capture_output=True, text=True
              ).stdout.strip()

          assert analyzer("manifest", "application-id", PROD_APK) == "com.fruitblast.autoclicker"
          assert analyzer("manifest", "min-sdk", PROD_APK) == "23"
          assert analyzer("manifest", "target-sdk", PROD_APK) == "35"

          production = ET.parse("verification-logs/production-manifest.xml").getroot()
          test_manifest = ET.parse("verification-logs/instrumentation-manifest.xml").getroot()
          assert production.get("package") == "com.fruitblast.autoclicker", (
              f"Unexpected production manifest package: {production.get('package')!r}"
          )
          assert test_manifest.get("package") == "com.fruitblast.autoclicker.test", (
              f"Unexpected instrumentation package: {test_manifest.get('package')!r}"
          )
          instrumentation = test_manifest.find("instrumentation")
          assert instrumentation is not None, "Instrumentation declaration missing"
          assert instrumentation.get(ANDROID + "targetPackage") == "com.fruitblast.autoclicker"
          assert instrumentation.get(ANDROID + "name") == "androidx.test.runner.AndroidJUnitRunner"

          compiled = ET.parse("verification-logs/accessibility-compiled.xml").getroot()
          def parse_flags(value, symbolic_values, attribute):
              value = value.strip()
              if value.lower().startswith("0x") or value.isdigit():
                  return int(value, 0)
              result = 0
              for name in value.split("|"):
                  name = name.strip()
                  assert name in symbolic_values, (
                      f"Unknown {attribute} symbolic value: {name!r}"
                  )
                  result |= symbolic_values[name]
              return result

          actual_events = compiled.get(ANDROID + "accessibilityEventTypes")
          assert actual_events is not None, "Compiled accessibilityEventTypes missing"
          expected_events = 0x20 | 0x400000
          parsed_events = parse_flags(
              actual_events,
              {
                  "typeWindowStateChanged": 0x20,
                  "typeWindowsChanged": 0x400000,
              },
              "accessibilityEventTypes",
          )
          assert parsed_events == expected_events, (
              f"Compiled accessibilityEventTypes: expected mask 0x{expected_events:x}, "
              f"got {actual_events!r} (0x{parsed_events:x})"
          )

          actual_feedback = compiled.get(ANDROID + "accessibilityFeedbackType")
          assert actual_feedback is not None, "Compiled accessibilityFeedbackType missing"
          parsed_feedback = parse_flags(
              actual_feedback,
              {"feedbackGeneric": 0x10},
              "accessibilityFeedbackType",
          )
          assert parsed_feedback == 0x10, (
              f"Compiled accessibilityFeedbackType: expected feedbackGeneric (0x10), "
              f"got {actual_feedback!r}"
          )

          actual_retrieve = compiled.get(ANDROID + "canRetrieveWindowContent")
          assert actual_retrieve is not None and actual_retrieve.lower() == "true", (
              f"Compiled canRetrieveWindowContent: expected true, got {actual_retrieve!r}"
          )

          actual_timeout = compiled.get(ANDROID + "notificationTimeout")
          assert actual_timeout is not None and int(actual_timeout, 0) == 100, (
              f"Compiled notificationTimeout: expected 100, got {actual_timeout!r}"
          )

          def component_names(manifest):
              app = manifest.find("application")
              assert app is not None, "Manifest application element missing"
              names = set()
              for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
                  for node in app.findall(tag):
                      name = node.get(ANDROID + "name")
                      if not name:
                          continue
                      if name.startswith("."):
                          name = manifest.get("package", "") + name
                      elif "." not in name:
                          name = manifest.get("package", "") + "." + name
                      names.add(name)
              return names

          production_components = component_names(production)
          instrumentation_components = component_names(test_manifest)
          leaked = production_components.intersection(instrumentation_components)
          assert not leaked, f"Instrumentation-only components leaked into production APK: {sorted(leaked)}"

          fixture = "com.fruitblast.app.automation.AccessibilityNodeFixtureActivity"
          assert fixture in instrumentation_components, "Expected instrumentation fixture is missing"
          assert fixture not in production_components, "Instrumentation fixture leaked into production APK"

          print("PASS: F04 compiled AccessibilityService XML values")
          print("PASS: F05 production/test package identity, SDK levels and instrumentation runner")
          print("PASS: F05 instrumentation component isolation across activity, activity-alias, service, receiver and provider")
          PY

          for APK in "$PROD_APK" "$TEST_APK"; do
            LABEL="$(basename "$APK" .apk)"
            unzip -t "$APK" > "verification-logs/$LABEL-zip-test.txt"
            "$APKSIGNER" verify --verbose --print-certs "$APK" \
              > "verification-logs/$LABEL-signature.txt" 2>&1
          done

          {
            echo "PASS: production APK archive integrity"
            echo "PASS: instrumentation APK archive integrity"
            echo "PASS: production APK signature verification"
            echo "PASS: instrumentation APK signature verification"
          } | tee verification-logs/offline-p0-integrity.txt

      - name: Verify F01 compiled instrumentation test class and methods
        id: offline_f01
        shell: bash
        run: |
          set -euo pipefail
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          CLASS="com.fruitblast.app.automation.AccessibilityNodeObserverInstrumentationTest"
          test -s "$TEST_APK"
          "$ANALYZER" dex code --class "$CLASS" "$TEST_APK" > verification-logs/f01-instrumentation-test-class.dex.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          dex_dump = Path("verification-logs/f01-instrumentation-test-class.dex.txt").read_text()
          expected_methods = {
              "observesFrameworkNodeTreeAndClassifiesCloseControl",
              "nodeBudgetOverflowReturnsUnknownWithoutPartialClassification",
              "depthBudgetOverflowReturnsUnknownWithoutPartialClassification",
              "elapsedTimeBudgetOverflowReturnsUnknownWithoutPartialClassification",
              "nullRootReturnsUnknown",
              "repeatedObservationsUseFreshFrameworkNodes",
          }
          missing = sorted(name for name in expected_methods if not re.search(r"\b" + re.escape(name) + r"\b", dex_dump))
          assert not missing, f"Compiled instrumentation test methods missing from test APK DEX: {missing}"
          assert "AccessibilityNodeObserverInstrumentationTest" in dex_dump, "Instrumentation test class missing from DEX output"
          print(f"PASS: F01 instrumentation test class and {len(expected_methods)} expected @Test methods are compiled into the test APK")
          print("BOUNDARY: APK compilation only; no instrumentation test method was executed")
          PY

      - name: Verify F02 AccessibilityService lifecycle source contract
        id: offline_f02
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("app/src/main/kotlin/com/fruitblast/app/automation/FruitBlastAccessibilityService.kt")
          source = source_path.read_text()

          assert re.search(r"class\s+FruitBlastAccessibilityService\s*:\s*AccessibilityService\s*\(", source), (
              "F02: service must remain an AccessibilityService subclass"
          )

          def method_body(signature_pattern, label):
              match = re.search(signature_pattern, source)
              assert match, f"F02: missing callback declaration {label}"
              opening = source.find("{", match.end())
              assert opening >= 0, f"F02: callback {label} has no body"
              depth = 0
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:index]
              raise AssertionError(f"F02: unterminated callback body {label}")

          event_body = method_body(r"override\s+fun\s+onAccessibilityEvent\s*\(\s*event\s*:\s*AccessibilityEvent\s*\)", "onAccessibilityEvent")
          interrupt_body = method_body(r"override\s+fun\s+onInterrupt\s*\(\s*\)", "onInterrupt")
          destroy_body = method_body(r"override\s+fun\s+onDestroy\s*\(\s*\)", "onDestroy")

          assert "lastWindowEventPackage = null" in interrupt_body, "F02: onInterrupt must invalidate cached event package"
          assert "lastWindowEventPackage = null" in destroy_body, "F02: onDestroy must invalidate cached event package"
          assert re.search(r"\bsuper\.onDestroy\s*\(\s*\)", destroy_body), "F02: onDestroy must call super.onDestroy()"

          checks = {
              "service_subclass": True,
              "onAccessibilityEvent_callback": "event.eventType" in event_body,
              "onInterrupt_cache_invalidation": "lastWindowEventPackage = null" in interrupt_body,
              "onDestroy_cache_invalidation": "lastWindowEventPackage = null" in destroy_body,
              "onDestroy_super_call": bool(re.search(r"\bsuper\.onDestroy\s*\(\s*\)", destroy_body)),
          }
          assert all(checks.values()), f"F02: lifecycle source contract failed: {checks}"
          import json
          Path("verification-logs/f02-lifecycle-source-assertions.json").write_text(
              json.dumps({"status": "PASS", "assertions": checks, "verification_tier": "static source only"}, indent=2) + "\n"
          )
          print("PASS: F02 AccessibilityService subclass, event callback, interrupt/destroy cache invalidation and superclass destroy call")
          print("BOUNDARY: static source assertions only; Android lifecycle callbacks were not invoked")
          PY

      - name: Verify F06 lint warning allowlist and emit triage report
        id: offline_f06
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("app/build/reports/lint-results-debug.xml")
          root = ET.parse(report).getroot()
          expected = {
              "OldTargetApi": ("app/build.gradle.kts", "Warning"),
              "AndroidGradlePluginVersion": ("gradle/wrapper/gradle-wrapper.properties", "Warning"),
              "SwitchIntDef": ("app/src/main/kotlin/com/fruitblast/app/automation/FruitBlastAccessibilityService.kt", "Warning"),
              "DataExtractionRules": ("app/src/main/AndroidManifest.xml", "Warning"),
              "MissingApplicationIcon": ("app/src/main/AndroidManifest.xml", "Warning"),
          }
          issues = root.findall(".//issue")
          actual_ids = [issue.get("id") for issue in issues]
          errors = [
              issue for issue in issues
              if (issue.get("severity") or "").lower() in {"error", "fatal"}
          ]
          warnings = [issue for issue in issues if (issue.get("severity") or "").lower() == "warning"]
          assert not errors, [
              {"id": item.get("id"), "severity": item.get("severity"), "message": item.get("message")}
              for item in errors
          ]
          assert len(warnings) == len(expected), (
              f"F06: expected exactly {len(expected)} known warnings, got {len(warnings)}"
          )
          assert len(issues) == len(expected), (
              f"F06: unexpected non-warning lint issues present: {len(issues)} total issues"
          )

          records = []
          for issue in warnings:
              issue_id = issue.get("id")
              assert issue_id in expected, f"F06: unexpected lint warning ID {issue_id!r}"
              expected_file, expected_severity = expected[issue_id]
              assert issue.get("severity") == expected_severity, (
                  f"F06: {issue_id} severity expected {expected_severity}, got {issue.get('severity')!r}"
              )
              locations = issue.findall("location")
              files = sorted({
                  location.get("file", "").replace("\\", "/")
                  for location in locations if location.get("file")
              })
              assert any(
                  actual_file == expected_file or actual_file.endswith("/" + expected_file)
                  for actual_file in files
              ), (
                  f"F06: {issue_id} expected file suffix {expected_file!r}, got {files!r}"
              )
              records.append({
                  "id": issue_id,
                  "severity": issue.get("severity"),
                  "file": expected_file,
                  "line": [
                      location.find("attribute").get("value")
                      for location in locations
                      if location.find("attribute") is not None
                      and location.find("attribute").get("name") == "line"
                  ],
                  "message": issue.get("message", ""),
                  "status": "OPEN — triaged, not modified or accepted",
                  "proposed_action": "Review separately; no source/configuration change in F06-C-6",
              })

          assert set(actual_ids) == set(expected), (
              f"F06: lint issue set mismatch, expected {sorted(expected)}, got {sorted(actual_ids)}"
          )
          records.sort(key=lambda item: item["id"])
          output = {
              "status": "PASS",
              "lint_tool_version": root.get("by"),
              "expected_warning_count": len(expected),
              "actual_warning_count": len(warnings),
              "error_fatal_count": len(errors),
              "warnings": records,
              "policy": "Fail on any new/missing warning ID, severity drift, file drift, or Error/Fatal finding",
              "scope_boundary": "Triage assertions only; warnings remain open and no lint/source fixes are applied",
          }
          Path("verification-logs/f06-lint-triage.json").write_text(json.dumps(output, indent=2) + "\n")
          print(f"PASS: F06 exact lint allowlist ({len(warnings)} known warnings); zero Error/Fatal; no unexpected issues")
          for item in records:
              print(f"OPEN: {item['id']} [{item['severity']}] {item['file']}: {item['message']}")
          PY

      - name: Create verification summary and checksums
        if: always()
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          INSTRUMENTATION_OUTCOME: ${{ steps.instrumentation.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifests.outcome }}
          OFFLINE_P0_OUTCOME: ${{ steps.offline_p0.outcome }}
          OFFLINE_F01_OUTCOME: ${{ steps.offline_f01.outcome }}
          OFFLINE_F02_OUTCOME: ${{ steps.offline_f02.outcome }}
          OFFLINE_F06_OUTCOME: ${{ steps.offline_f06.outcome }}
        run: |
          mkdir -p verification-logs
          {
            echo "F06-C-5 Offline P0 Android Verification"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Policy verification: ${POLICY_OUTCOME:-not_run}"
            echo "Production APK: ${PRODUCTION_OUTCOME:-not_run}"
            echo "Instrumentation APK compile: ${INSTRUMENTATION_OUTCOME:-not_run}"
            echo "Lint: ${LINT_OUTCOME:-not_run}"
            echo "App unit tests (:app:testDebugUnitTest): ${UNIT_TEST_OUTCOME:-not_run}"
            echo "Manifest/configuration assertions: ${MANIFEST_OUTCOME:-not_run}"
            echo "Offline P0 APK identity/compiled XML/integrity assertions: ${OFFLINE_P0_OUTCOME:-not_run}"
            echo "F01 instrumentation test class/method compilation assertions: ${OFFLINE_F01_OUTCOME:-not_run} (execution NOT RUN)"
            echo "F02 AccessibilityService lifecycle source assertions: ${OFFLINE_F02_OUTCOME:-not_run} (static only)"
            echo "F06 lint warning allowlist/triage assertions: ${OFFLINE_F06_OUTCOME:-not_run} (warnings remain OPEN)"
            echo "F03 Binder/recovery runtime: NOT RUN (separate scope)"
            echo "Runtime instrumentation tests: NOT RUN (offline tier)"
            echo "Emulator/device tests: NOT RUN"
          } | tee verification-logs/verification-summary.txt

          {
            java -version 2>&1 | head -n 1 || true
            ./gradlew --version 2>/dev/null | grep -m1 '^Gradle ' || true
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "Android platform: android-37.0"
          } > verification-logs/environment.txt

          files=()
          for file in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            if [ -s "$file" ]; then files+=("$file"); fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            sha256sum "${files[@]}" > verification-logs/SHA256SUMS.txt
            find verification-logs -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum >> verification-logs/SHA256SUMS.txt
          fi

      - name: Upload offline verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-a03-1-offline-android-verification
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            verification-logs/
          if-no-files-found: warn
          retention-days: 14
