name: FB-A03.1 Android Build Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fb-a03-1-android-build.yml"
      - "app/**"
      - "policy/**"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-a03-1-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Policy tests, Android build, APK manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 preview platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37\.0[[:space:]]'
          sdkmanager --channel=3 "platforms;android-37.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Provision Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate and verify Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin --stacktrace
          test -x ./gradlew
          grep -F "gradle-9.5.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Run Kotlin/JVM policy tests
        run: ./gradlew --no-daemon :policy:verifyPolicy

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK AccessibilityService manifest
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > manifest.txt
          grep -F "FruitBlastAccessibilityService" manifest.txt
          grep -F "android.permission.BIND_ACCESSIBILITY_SERVICE" manifest.txt
          grep -F "android.accessibilityservice.AccessibilityService" manifest.txt

      - name: Upload debug APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: fb-a03-1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            manifest.txt
          if-no-files-found: error
